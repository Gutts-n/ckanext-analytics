[project]
name = "ckanext-analytics"
version = "0.0.1"
description = "API usage tracking for CKAN: one analytics event per Action API request and resource download"
readme = "README.md"
authors = [
    {name = ""}
]
license = {text = "AGPL"}
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

keywords = [ "CKAN", ]
dependencies = []

[project.urls]
Homepage = "https://github.com//ckanext-analytics"

[project.entry-points."ckan.plugins"]
analytics = "ckanext.analytics.plugin:AnalyticsPlugin"


[build-system]
requires = ["setuptools<82"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
        "ignore::sqlalchemy.exc.SADeprecationWarning",
        "ignore::sqlalchemy.exc.SAWarning",
        "ignore::DeprecationWarning",
]
addopts = "--ckan-ini test.ini"
